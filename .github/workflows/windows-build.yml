name: Windows executable

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish an unused vMAJOR.MINOR.PATCH tag; leave blank for a test build'
        required: false
        type: string
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          architecture: x64

      - name: Validate release tag
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'Use a numeric release tag in vMAJOR.MINOR.PATCH format.'
          }

      - name: Install packager
        run: python -m pip install pyinstaller==6.22.2

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build standalone app
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed --noupx
          --name ClaudeUsageBot
          --add-data "widget.ps1:."
          --add-data "config.example.json:."
          native_app.py

      - name: Verify bundle
        run: python scripts/check-bundle.py dist/ClaudeUsageBot/ClaudeUsageBot.exe

      - name: Scan Windows package
        shell: powershell
        run: ./scripts/scan-windows.ps1 -Path dist/ClaudeUsageBot

      - name: Package ZIP and write checksum
        run: |
          Compress-Archive -Path dist/ClaudeUsageBot -DestinationPath dist/ClaudeUsageBot-Windows.zip -Force
          $hash = (Get-FileHash dist/ClaudeUsageBot-Windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ClaudeUsageBot-Windows.zip" | Set-Content dist/SHA256SUMS.txt -Encoding ASCII

      - name: Test executable on a clean profile
        run: python scripts/smoke-windows.py dist/ClaudeUsageBot-Windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ClaudeUsageBot-Windows
          path: |
            dist/ClaudeUsageBot-Windows.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach executable to GitHub release
        if: env.RELEASE_TAG != '' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw 'This release already exists. Choose a new version to preserve published downloads.'
          } else {
            gh release create "$env:RELEASE_TAG" dist/ClaudeUsageBot-Windows.zip dist/SHA256SUMS.txt `
              --target "$env:GITHUB_SHA" --title "Claude Usage Bot $env:RELEASE_TAG" `
              --notes "Download ClaudeUsageBot-Windows.zip, choose Extract All, then open ClaudeUsageBot.exe inside the extracted folder. Keep _internal beside the executable. Python is included. This package passed a Microsoft Defender scan and a Windows dashboard startup test." `
              --generate-notes --latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
